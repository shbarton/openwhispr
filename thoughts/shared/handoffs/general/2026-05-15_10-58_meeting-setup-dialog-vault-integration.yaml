questions:
  - 4 open questions from ui-ux-review.md (border radius 6 vs 8 vs 10, keep micro-shrink, dark warmth direction, strip metallic shadows)
  - Whether to add `track:` frontmatter for campaign grouping (recommendation was no — tags already do it)

decisions:
  - setVaultPath returns {valid,error}: collapsed path-exists IPC into setVaultPath so vault detection is single-sourced in the main process
  - cache signature check before broadcast: prevents thrashing renderers on unrelated vault saves (Calyx writes the index frequently)
  - async readFile + 1000ms debounce: unblock main thread; autocomplete tolerates staleness
  - keep tags-based categorization (ui + calyx-alignment): existing convention, no new frontmatter needed yet
  - kept generic show-open-dialog IPC over reusing noteFilesPickFolder: more future-proof shape

findings:
  - Real vault index schema is {snapshots: {uri: {properties: {type, tags, title, ...}}}} — NOT top-level tags/projects (codex consultation caught this assumption mismatch in a similar context)
  - Some vault project titles are non-string (likely parsed wikilink objects); some local note `project` fields are objects too — both needed defensive coercion
  - Electron main process doesn't hot-reload — every vaultMetadata.js change required full app restart during dev
  - pkill against Electron processes from harness fails ("Operation not permitted") for sam-owned procs; user must quit app manually or use `lsof -ti:5183 | xargs kill -9` (sometimes works)

worked:
  - Consulting Codex when stuck on "why is metadata empty" — flagged schema-mismatch and async race possibilities before I went deeper
  - Console-log injection into vault provider to see the real error (`localeCompare is not a function`) instead of guessing
  - Parallel scout agents for /simplify review (reuse + quality + efficiency) — found redundant IPC + sync FS read + missing change detection

failed:
  - Initial pathExists IPC + separate setVaultPath was TOCTOU + duplicated work — caught by efficiency review, collapsed
  - Trying to kill stuck Electron from harness — permission denied; user has to do it
  - First attempt at empty-vault diagnosis assumed it was a race, but real cause was a parse exception swallowed into "keep previous cache"

